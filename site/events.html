  Paris:   { tz:'Europe/Paris', lat:48.8566, lng:2.3522, flag:'🇫🇷', label:'Paris, France' }
};
function loadDefaultLoc() { try { const v = localStorage.getItem('sg_default_loc'); if (v && LOCS[v]) return v; } catch(e){} return 'Bizerte'; }
function saveDefaultLoc(v) { try { localStorage.setItem('sg_default_loc', v); } catch(e){} }
let currentLocation = loadDefaultLoc();

const fmtCache = {};
function tzFmt(tz) {
  return fmtCache[tz] || (fmtCache[tz] = new Intl.DateTimeFormat('fr-FR', { hour:'2-digit', minute:'2-digit', hourCycle:'h23', timeZone: tz }));
}
function fmtTime(ms, tz) { return tzFmt(tz).format(new Date(ms)); }
function tzOffset(tz, date) { // minutes
  const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const p = Object.fromEntries(f.formatToParts(date).map(x => [x.type, x.value]));
  const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return (asUTC - date.getTime()) / 60000;
}
function nowLocalISO(tz) {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }).formatToParts(new Date()).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}
function localISOtoMs(iso, tz) {
  const [d, t] = iso.split('T'); const [y, mo, da] = d.split('-').map(Number); const [h, mi] = t.split(':').map(Number);
  const guess = Date.UTC(y, mo - 1, da, h, mi);
  return guess - tzOffset(tz, new Date(guess)) * 60000;
}
function gmtMs(mi, day, gmt) {
  const hourOnly = gmt.endsWith('h');
  const [h, m] = hourOnly ? [parseInt(gmt), 0] : gmt.split(':').map(Number);
  return Date.UTC(2026, mi, parseInt(day, 10), h, m);
}
function getLocalTime(mi, day, gmt) {
  if (day === '—' || gmt === '🛰️') return '🛰️';
  const hourOnly = gmt.endsWith('h');
  const s = fmtTime(gmtMs(mi, day, gmt), LOCS[currentLocation].tz);
  return hourOnly && s.endsWith(':00') ? s.slice(0, 2) + 'h' : s;
}

// ====================================================================

function updateClock() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('fr-FR', { weekday:'short', day:'2-digit', month:'short', year:'numeric', timeZone: LOCS[currentLocation].tz });
  const timeStr = now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit', timeZone: LOCS[currentLocation].tz });
  $('clock').textContent = `${dateStr} ${timeStr}`;
}

// Constellation of lunar phase events is recomputed from the Sun's longitude
function evConstel(mi, e) {
  const m = e[2].match(/NOUVELLE LUNE|PLEINE LUNE|PREMIER QUARTIER|DERNIER QUARTIER/);
  if (!m) return e[4];
  const ty = { 'NOUVELLE LUNE':0, 'PREMIER QUARTIER':1, 'PLEINE LUNE':2, 'DERNIER QUARTIER':3 }[m[0]];
  const ms = gmtMs(mi, e[0], e[1]);
  return eclConstel(norm(sunLon(ms) + ty * 90));
}
// Max altitude badge for Moon-star events (depends on location latitude)
const starDec = { "Antarès":-26.4, "Spica":-11.2, "Regulus":12.0, "Pollux":28.0, "Pléiades":24.1 };
function altBadge(title) {
  for (const k in starDec) {
    if (title.includes(k)) {
      const alt = 90 - Math.abs(LOCS[currentLocation].lat - starDec[k]);
      const low = alt < 20;
      return `<span class="ml-1 px-1.5 py-0.5 rounded text-[10px] ${low ? 'bg-orange-900/40 text-orange-300' : 'bg-green-900/30 text-green'}">↑ ${alt.toFixed(0)}° max${low ? ' (bas)' : ''}</span>`;
    }
  }
  return '';
}

// ---- weather ----
const wxCache = {};
async function fetchWx(loc) {
  if (wxCache[loc] && Date.now() - wxCache[loc].t < 600000) return wxCache[loc].j;
  const L = LOCS[loc];
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lng}&hourly=temperature_2m,relative_humidity_2m,cloud_cover,precipitation_probability,precipitation,visibility,wind_speed_10m&daily=sunrise,sunset&timezone=${encodeURIComponent(L.tz)}&past_days=1&forecast_days=3`;
  const r = await fetch(url);
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  wxCache[loc] = { t: Date.now(), j };
  return j;
}
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
function ivoLabel(s) {
  if (s >= 80) return ['🌟 Excellent', '#4ade80'];
  if (s >= 65) return ['✅ Bon', '#9be89b'];
  if (s >= 45) return ['🟡 Moyen', '#ffd166'];
  if (s >= 25) return ['🟠 Médiocre', '#fb923c'];
  return ['⛔ Mauvais', '#f87171'];
}
async function fillWeather() {
  const box = $('wxBox'); if (!box) return;
  const loc = currentLocation, L = LOCS[loc];
  try {
    const j = await fetchWx(loc);
    if (loc !== currentLocation) return;
    const D = j.daily, H = j.hourly, now = nowLocalISO(L.tz);
    let ni = -1;
    for (let i = 0; i < D.time.length - 1; i++) { if (now < D.sunrise[i + 1]) { ni = i; break; } }
    if (ni < 0) ni = D.time.length - 2;
    const sSet = D.sunset[ni], sRise = D.sunrise[ni + 1];
    const idx = []; H.time.forEach((t, k) => { if (t > sSet && t < sRise) idx.push(k); });
    if (!idx.length) throw new Error('no data');
    const g = (arr, k, d = 0) => (arr[k] ?? d);
    const cloud = avg(idx.map(k => g(H.cloud_cover, k)));
    const rh = avg(idx.map(k => g(H.relative_humidity_2m, k)));
    const probMax = Math.max(...idx.map(k => g(H.precipitation_probability, k)));
    const precip = idx.reduce((s, k) => s + g(H.precipitation, k), 0);
    const vis = avg(idx.map(k => g(H.visibility, k, 20000)));
    const wind = avg(idx.map(k => g(H.wind_speed_10m, k)));
    const temp = avg(idx.map(k => g(H.temperature_2m, k)));
    const moonUp = idx.map(k => moonAltAz(localISOtoMs(H.time[k], L.tz), L.lat, L.lng).alt > 0);
    const fracUp = moonUp.filter(Boolean).length / idx.length;
    const midMs = (localISOtoMs(sSet, L.tz) + localISOtoMs(sRise, L.tz)) / 2;
    const illum = (1 - Math.cos(elongAt(midMs) * R)) / 2;
    const pCloud = cloud * 0.55, pRain = Math.min(25, probMax * 0.2 + precip * 5), pHum = Math.max(0, rh - 65) * 0.35;
    const pVis = vis < 10000 ? (10000 - vis) / 10000 * 8 : 0, pWind = Math.min(5, Math.max(0, wind - 20) * 0.25), pMoon = illum * 15 * fracUp;
    const score = Math.round(Math.max(0, Math.min(100, 100 - (pCloud + pRain + pHum + pVis + pWind + pMoon))));
    const [lab, col] = ivoLabel(score);
    const hh = t => t.slice(11, 16);
    const chips = idx.map((k, n) => {
      const c = g(H.cloud_cover, k), cc = c < 25 ? '#4ade80' : c < 60 ? '#ffd166' : '#f87171';
      return `<div class="min-w-[56px] text-center rounded bg-panel2 p-1 flex-shrink-0">
        <div class="text-[10px] text-gray-400">${hh(H.time[k])}${moonUp[n] ? ' 🌙' : ''}</div>
        <div class="text-xs font-bold" style="color:${cc}">☁ ${c}%</div>
        <div class="text-[10px] text-sky">💧 ${g(H.relative_humidity_2m, k)}%</div>
        <div class="text-[10px] text-gray-300">🌧 ${g(H.precipitation_probability, k)}%</div></div>`;
    }).join('');
    const row = (ico, txt, pen) => `<div class="flex justify-between text-xs border-b border-border/50 py-1"><span class="text-gray-300">${ico} ${txt}</span><span class="${pen > 0.5 ? 'text-orange-300' : 'text-gray-500'}">${pen > 0.5 ? '−' + pen.toFixed(0) : '0'}</span></div>`;
    box.innerHTML = `
      <div class="text-[11px] text-gray-500 mb-2">Nuit du ${sSet.slice(8, 10)}/${sSet.slice(5, 7)} · coucher ${hh(sSet)} → lever ${hh(sRise)} (${L.flag} ${loc}) · ${temp.toFixed(0)}°C en moyenne</div>
      <div class="flex items-center gap-3 mb-3">
        <div class="text-center"><div class="text-4xl font-black" style="color:${col}">${score}</div><div class="text-[10px] text-gray-500">/ 100</div></div>
        <div class="flex-1"><div class="text-sm font-bold mb-1" style="color:${col}">${lab} — Indice de visibilité à l'œil nu</div>
          <div class="h-2.5 rounded bg-panel2 overflow-hidden"><div class="h-full" style="width:${score}%;background:${col}"></div></div></div></div>
      ${row('☁️', `Nuages : ${cloud.toFixed(0)} % en moyenne`, pCloud)}
      ${row('🌧️', `Pluie : probabilité max ${probMax.toFixed(0)} %, cumul ${precip.toFixed(1)} mm`, pRain)}
      ${row('💧', `Humidité : ${rh.toFixed(0)} %`, pHum)}
      ${row('👁️', `Visibilité horizontale : ${(vis / 1000).toFixed(0)} km`, pVis)}
      ${row('🌬️', `Vent : ${wind.toFixed(0)} km/h`, pWind)}
      ${row('🌙', `Lune : ${(illum * 100).toFixed(0)} % éclairée, levée ${(fracUp * 100).toFixed(0)} % de la nuit`, pMoon)}
      <div class="flex gap-1.5 overflow-x-auto scrollbar-hide mt-3 pb-1">${chips}</div>
      <p class="text-[10px] text-gray-600 mt-2">Données : Open-Meteo. Indice = 100 − pénalités (nuages 55 %, pluie, humidité > 65 %, visibilité < 10 km, vent > 20 km/h, Lune). Indicatif, hors turbulence et pollution lumineuse locale.</p>`;
  } catch (err) {
    if (loc !== currentLocation) return;
    box.innerHTML = `<div class="text-xs text-orange-300">Météo indisponible (connexion ou API). Consultez directement <a class="wikilink text-sky" href="https://clearoutside.com/forecast/${L.lat.toFixed(2)}/${L.lng.toFixed(2)}" target="_blank" rel="noopener">Clear Outside</a>.</div>`;
  }
}

// ---- moon ----
function buildMoonSection() {
  const L = LOCS[currentLocation];
  const [y, m, d] = nowLocalISO(L.tz).slice(0, 10).split('-').map(Number);
  const base = Date.UTC(y, m - 1, d);
  let prev = moonDay(base - 86400000, L);
  let prevLon = moonAltAz(prev.start + 22 * 3600000, L.lat, L.lng).lon;
  const rows = []; let tonight = null;
  for (let i = 0; i < 7; i++) {
    const day = base + i * 86400000, ev = moonDay(day, L);
    const t22 = ev.start + 22 * 3600000, p = moonAltAz(t22, L.lat, L.lng);
    const cst = eclConstel(p.lon), mz = manazilAlQamar[manzilIndex(p.lon)];
    const delay = (ev.rise && prev.rise) ? Math.round((ev.rise - prev.rise) / 60000 - 1440) : null;
    const dLon = norm(p.lon - prevLon);
    const label = new Date(day).toLocaleDateString('fr-FR', { weekday:'short', day:'2-digit', month:'short', timeZone:'UTC' });
    if (i === 0) tonight = { p, cst, mz, ev };
    rows.push(`<tr class="border-b border-border ${i === 0 ? 'bg-panel2/60' : ''}">
      <td class="py-1.5 px-2 whitespace-nowrap text-sky font-bold">${label}${i === 0 ? ' •' : ''}</td>
      <td class="py-1.5 px-2 whitespace-nowrap">${moonEmoji(p.elong)} ${(p.illum * 100).toFixed(0)}% <span class="text-gray-500 text-[10px]">${p.age.toFixed(1)} j</span></td>
      <td class="py-1.5 px-2 whitespace-nowrap">${constelLink(cst, false)}<div class="text-[10px] text-gray-500">λ ${p.lon.toFixed(0)}° · élong. ${p.elong.toFixed(0)}°</div></td>
      <td class="py-1.5 px-2 whitespace-nowrap arabic text-gold text-xs">${mz[0]} · ${mz[1]}</td>
      <td class="py-1.5 px-2 whitespace-nowrap">${p.alt > 0 ? `${compass(p.az)} ${p.alt.toFixed(0)}°` : '<span class="text-gray-500">sous l\'horizon</span>'}</td>
      <td class="py-1.5 px-2 whitespace-nowrap text-gold">${ev.rise ? fmtTime(ev.rise, L.tz) : '—'}${delay !== null ? `<div class="text-[10px] text-gray-500">${delay >= 0 ? '+' : ''}${delay} min</div>` : ''}</td>
      <td class="py-1.5 px-2 whitespace-nowrap">${ev.culm ? fmtTime(ev.culm, L.tz) + `<div class="text-[10px] text-gray-500">${ev.culmAlt.toFixed(0)}°</div>` : '—'}</td>
      <td class="py-1.5 px-2 whitespace-nowrap text-gold">${ev.set ? fmtTime(ev.set, L.tz) : '—'}</td>
      <td class="py-1.5 px-2 whitespace-nowrap text-gray-400">+${dLon.toFixed(1)}°</td></tr>`);
    prev = ev; prevLon = p.lon;
  }
  const t = tonight;
  const summary = `<div class="bg-panel border border-gold/40 rounded-lg p-3 mb-3">
    <div class="text-gold font-bold text-sm mb-1">${moonEmoji(t.p.elong)} Ce soir à 22h (${currentLocation})</div>
    <div class="text-gray-200 text-xs">${phaseName(t.p.elong)} · ${(t.p.illum * 100).toFixed(0)} % éclairée · âge ${t.p.age.toFixed(1)} j · dans ${constelLink(t.cst, false)} (λ ${t.p.lon.toFixed(0)}°) ·
      manzil <span class="arabic text-gold">${t.mz[0]} ${t.mz[1]}</span>
      · ${t.p.alt > 0 ? `direction <b>${compass(t.p.az)}</b>, hauteur <b>${t.p.alt.toFixed(0)}°</b>` : 'sous l\'horizon à 22h'}</div></div>`;

  // monthly table
  const monthCells = Array.from({ length: 12 }, () => [[], [], [], []]);
  PHASES_RAW.forEach(([ty, iso]) => {
    const ms = Date.parse(iso + ':00Z');
    const parts = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone:L.tz, year:'numeric', month:'2-digit', day:'2-digit' }).formatToParts(new Date(ms)).map(x => [x.type, x.value]));
    if (+parts.year !== 2026) return;
    const cst = eclConstel(norm(sunLon(ms) + ty * 90));
    monthCells[+parts.month - 1][ty].push(`<div class="whitespace-nowrap">${parts.day} <span class="text-gray-500 text-[10px]">${fmtTime(ms, L.tz)}</span> · ${constelLink(cst, false)}</div>`);
  });
  const mrows = MONTHS.map((mn, i) => `<tr class="border-b border-border ${i === today.getMonth() ? 'bg-panel2/60' : ''}">
    <td class="py-1.5 px-2 text-sky font-bold whitespace-nowrap">${mn.slice(0, 4)}.</td>
    ${[0, 1, 2, 3].map(ty => `<td class="py-1.5 px-2 text-xs">${monthCells[i][ty].join('') || '—'}</td>`).join('')}</tr>`).join('');

  const explain = `<div class="text-xs text-gray-300 space-y-1.5 mb-3">
    <p>🧭 <b class="text-gold">Mouvement vers l'est :</b> parmi les étoiles, la Lune avance d'environ <b>13,2° par jour</b> (≈ 0,55° par heure, soit un diamètre lunaire par heure) et fait le tour du ciel en <b>27,3 jours</b>.</p>
    <p>☀️ <b class="text-gold">Par rapport au Soleil</b> (qui avance de ≈ 1°/jour) elle gagne ≈ <b>12,2°/jour</b> : d'où le cycle de phases de 29,5 jours.</p>
    <p>⏱️ <b class="text-gold">Conséquence :</b> la Lune se lève en moyenne <b>≈ 50 min plus tard chaque jour</b> (de ≈ 25-35 min autour de la pleine Lune d'automne à ≈ 70 min selon saison et latitude).</p>
    <p>📐 <b class="text-gold">Hauteur au méridien</b> = 90° − latitude + déclinaison. La déclinaison lunaire oscille entre ≈ −28° et +28° en 27 jours (cycle de 18,6 ans proche de son maximum en 2025-2026) : à ${currentLocation}, la Lune culmine entre ≈ ${(90 - LOCS[currentLocation].lat - 28).toFixed(0)}° et ≈ ${(90 - LOCS[currentLocation].lat + 28).toFixed(0)}°.</p>
    <p>🌕 <b class="text-gold">Où la trouver chaque mois :</b> la pleine Lune est toujours à l'opposé du Soleil (haute en hiver, basse en été), la nouvelle Lune dans la constellation du Soleil, les quartiers à ≈ 90° de part et d'autre.</p></div>`;

  const phaseTable = `<div class="overflow-x-auto rounded-lg border border-border mb-3"><table class="w-full bg-panel text-xs">
    <thead><tr class="bg-panel2 text-gold"><th class="py-1.5 px-2 text-left">Phase</th><th class="py-1.5 px-2 text-left">Âge</th><th class="py-1.5 px-2 text-left">Élongation</th><th class="py-1.5 px-2 text-left">Lever ≈</th><th class="py-1.5 px-2 text-left">Coucher ≈</th><th class="py-1.5 px-2 text-left">Où chercher</th></tr></thead><tbody>
    ${[['🌑 Nouvelle','0 j','0°','avec le Soleil','avec le Soleil','Invisible'],
       ['🌒 Croissant','≈ 3,5 j','≈ 45°','≈ 3 h après le Soleil','≈ 3 h après le coucher du Soleil','Ouest, bas, juste après le coucher'],
       ['🌓 Premier quartier','≈ 7,4 j','90°','≈ midi','≈ minuit','Sud au coucher du Soleil'],
       ['🌔 Gibbeuse croissante','≈ 11 j','≈ 135°','≈ 15 h','≈ 3 h du matin','Sud-Est en soirée'],
       ['🌕 Pleine','≈ 14,8 j','180°','au coucher du Soleil','au lever du Soleil','Est au coucher, toute la nuit'],
       ['🌖 Gibbeuse décroissante','≈ 18,5 j','≈ 225°','≈ 21-22 h','≈ midi','Est tard le soir, Sud au petit matin'],
       ['🌗 Dernier quartier','≈ 22 j','270°','≈ minuit','≈ midi','Sud au lever du Soleil'],
       ['🌘 Dernier croissant','≈ 25,5 j','≈ 315°','≈ 3 h avant le Soleil','≈ 3 h après le Soleil','Est avant l\'aube']
      ].map(r => `<tr class="border-b border-border">${r.map(c => `<td class="py-1.5 px-2">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

  return `${summary}
    <div class="text-sky font-bold text-xs mb-1">📅 La Lune sur les 7 prochains jours (${currentLocation}, position à 22 h)</div>
    <div class="overflow-x-auto rounded-lg border border-border mb-1"><table class="w-full bg-panel text-xs">
      <thead><tr class="bg-panel2 text-gold"><th class="py-1.5 px-2 text-left">Jour</th><th class="py-1.5 px-2 text-left">Phase</th><th class="py-1.5 px-2 text-left">Constellation</th><th class="py-1.5 px-2 text-left">Manzil</th><th class="py-1.5 px-2 text-left">À 22 h</th><th class="py-1.5 px-2 text-left">Lever (Δ/j)</th><th class="py-1.5 px-2 text-left">Culm. (h°)</th><th class="py-1.5 px-2 text-left">Coucher</th><th class="py-1.5 px-2 text-left">Δ°/jour</th></tr></thead>
      <tbody>${rows.join('')}</tbody></table></div>
    <p class="text-[10px] text-gray-600 mb-3">Calcul simplifié à partir des dates exactes des phases 2026 : heures ≈ ±20 min, positions ≈ ±2°. Δ°/jour = déplacement de la Lune parmi les étoiles en 24 h.</p>
    ${explain}${phaseTable}
    <div class="text-sky font-bold text-xs mb-1">🗓️ Où trouver la Lune chaque mois (constellation à chaque phase, heures ${currentLocation})</div>
    <div class="overflow-x-auto rounded-lg border border-border"><table class="w-full bg-panel text-xs">
      <thead><tr class="bg-panel2 text-gold"><th class="py-1.5 px-2 text-left">Mois</th><th class="py-1.5 px-2 text-left">🌑 Nouvelle</th><th class="py-1.5 px-2 text-left">🌓 PQ</th><th class="py-1.5 px-2 text-left">🌕 Pleine</th><th class="py-1.5 px-2 text-left">🌗 DQ</th></tr></thead>
      <tbody>${mrows}</tbody></table></div>`;
}

// ---- spots ----
function spotsHtml(loc) {
  return SPOTS[loc].map(s => `<div class="bg-panel border border-border rounded-lg p-2.5 mb-2">
    <div class="flex justify-between gap-2"><div class="text-sm font-bold text-gray-100">${s.n}</div><div class="text-[10px] text-sky whitespace-nowrap">${s.d}</div></div>
    <div class="text-[11px] text-gray-400 mt-0.5">${s.note}</div>
    <div class="flex justify-between items-center mt-1.5"><span class="text-[10px] text-gold">Pollution lumineuse : ${s.p}</span>
      <a class="wikilink text-sky text-[11px]" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.q)}" target="_blank" rel="noopener">📍 Carte</a></div></div>`).join('');
}
function buildSpotsSection() {
  const other = currentLocation === 'Paris' ? 'Bizerte' : 'Paris';
  const L = LOCS[currentLocation];
  return `<div class="text-[11px] text-gray-500 mb-2">Indicatif : vérifiez toujours la pollution lumineuse (<a class="wikilink text-sky" href="https://www.lightpollutionmap.info/#zoom=9&lat=${L.lat}&lon=${L.lng}" target="_blank" rel="noopener">carte autour de ${currentLocation}</a>), l'accès de nuit, la sécurité et la réglementation locale.</div>
    <div class="text-sky font-bold text-xs mb-2">${LOCS[currentLocation].flag} ${currentLocation}</div>${spotsHtml(currentLocation)}
    <details class="mt-3"><summary class="text-sky font-bold text-xs mb-2"><span class="sum-arrow">▸</span> ${LOCS[other].flag} ${other}</summary><div class="mt-2">${spotsHtml(other)}</div></details>
    <div class="bg-panel2/60 rounded-lg p-2.5 mt-3 text-[11px] text-gray-300"><b class="text-gold">Conseils :</b> arrivez au crépuscule (adaptation de l'œil : 20-30 min), lumière rouge uniquement, horizon nord/est dégagé, évitez la pleine Lune pour le ciel profond, habillez-vous chaudement et prévenez un proche.</div>`;
}

function buildReadyHtml() {
  const L = LOCS[currentLocation];
  const tools = `<div class="grid gap-2 mb-4 sm:grid-cols-3">
    ${[['🗺️ Pollution lumineuse',`https://www.lightpollutionmap.info/#zoom=9&lat=${L.lat}&lon=${L.lng}`,`Centrée sur ${currentLocation}`],
       ['🗺️ Dark Sky Map','https://djlorenz.github.io/astronomy/lp/overlay/dark.html','Trouver un endroit sombre'],
       ['☁️ Clear Outside',`https://clearoutside.com/forecast/${L.lat.toFixed(2)}/${L.lng.toFixed(2)}`,'Prévision astro détaillée'],
       ['🛰️ Passages ISS',`https://www.heavens-above.com/PassSummary.aspx?satid=25544&lat=${L.lat}&lng=${L.lng}&loc=${currentLocation}&alt=9`,`Géolocalisés ${currentLocation}`],
       ['🛰️ Passages Tiangong',`https://www.heavens-above.com/PassSummary.aspx?satid=48274&lat=${L.lat}&lng=${L.lng}&loc=${currentLocation}&alt=9`,`Géolocalisés ${currentLocation}`],
       ['🪐 Stellarium Web','https://stellarium-web.org','Planétarium interactif']
      ].map(l => `<a href="${l[1]}" target="_blank" rel="noopener" class="bg-panel border border-border rounded-lg p-2.5 hover:bg-panel2"><div class="text-gold font-bold text-xs">${l[0]}</div><div class="text-gray-400 text-[11px]">${l[2]}</div></a>`).join('')}</div>`;

  const tonightMz = manzilIndex(moonAltAz(Date.UTC(...nowLocalISO(L.tz).slice(0, 10).split('-').map((v, i) => i === 1 ? +v - 1 : +v)) - tzOffset(L.tz, new Date()) * 60000 + 22 * 3600000, L.lat, L.lng).lon);

  const starsRows = topStars.map(s => `<tr class="border-b border-border hover:bg-panel2">
    <td class="py-1.5 px-3 text-gray-500">${s[0]}</td><td class="py-1.5 px-3"><a class="wikilink text-sky" href="${s[4]}" target="_blank" rel="noopener">${s[1]}</a></td>
    <td class="py-1.5 px-3 arabic text-gold text-sm">${s[5]}</td><td class="py-1.5 px-3 text-gold font-bold">${s[2]}</td>
    <td class="py-1.5 px-3 text-gray-400">${constelLink(s[3], false)}</td><td class="py-1.5 px-3 whitespace-nowrap">${visBadge(s[7])}</td></tr>`).join('');
  const galRows = topGalaxies.map(g => `<tr class="border-b border-border hover:bg-panel2">
    <td class="py-1.5 px-3 text-gray-500">${g[0]}</td><td class="py-1.5 px-3"><a class="wikilink text-green" href="${g[5]}" target="_blank" rel="noopener">${g[1]}</a></td>
    <td class="py-1.5 px-3 arabic text-gold text-sm">${g[6]}</td><td class="py-1.5 px-3 text-gold font-bold">${g[2]}</td>
    <td class="py-1.5 px-3 text-gray-400">${constelLink(g[3], false)}</td><td class="py-1.5 px-3 text-gray-500 text-xs">${g[4]}</td><td class="py-1.5 px-3 whitespace-nowrap">${visBadge(g[7])}</td></tr>`).join('');
  const mzRows = manazilAlQamar.map((z, i) => `<tr class="border-b border-border hover:bg-panel2 ${i === tonightMz ? 'bg-yellow-900/20' : ''}">
    <td class="py-1.5 px-3 text-gray-500">${z[0]}${i === tonightMz ? ' 🌙' : ''}</td>
    <td class="py-1.5 px-3 arabic text-gold text-base"><a href="https://ar.wikipedia.org/w/index.php?search=${encodeURIComponent(z[1])}" target="_blank" rel="noopener">${z[1]}</a></td>
    <td class="py-1.5 px-3 text-sky italic text-xs">${z[2]}</td><td class="py-1.5 px-3 text-gray-300">${z[3]}</td>
    <td class="py-1.5 px-3 text-gray-400">${constelLink(z[4], false)}</td></tr>`).join('');

  const seasonBlock = `<div class="flex gap-1.5 mb-3" id="seasonBtns"></div><div id="seasonList" class="grid gap-2 sm:grid-cols-2"></div>`;
  const tbl = (head, body) => `<div class="overflow-x-auto rounded-lg border border-border"><table class="w-full bg-panel text-sm"><thead><tr class="bg-panel2 text-gold text-xs">${head.map(h => `<th class="py-2 px-3 text-left">${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;

  return `${tools}
    ${sec('🌤️ Météo cette nuit & indice de visibilité à l\'œil nu', `<div id="wxBox" class="text-xs text-gray-400">Chargement de la météo…</div>`, true)}
    ${sec('🌙 La Lune : où la trouver, jour après jour', buildMoonSection(), true)}
    ${sec('📍 Meilleurs lieux d\'observation', buildSpotsSection(), false)}
    ${sec('🍂 Constellations par saison', seasonBlock, false)}
    ${sec('⭐ Top 50 des étoiles les plus brillantes à l\'œil nu', `<div class="text-[11px] text-gray-500 mb-2">Colonne « Visible » calculée pour ${currentLocation} (hauteur maximale au méridien).</div>` + tbl(['#','Étoile','اسم عربي','Magnitude','Constellation',`Visible (${currentLocation})`], starsRows), false)}
    ${sec('🌌 Top 20 des galaxies les plus brillantes à l\'œil nu', tbl(['#','Galaxie','اسم عربي','Magnitude','Constellation','Conditions',`Visible (${currentLocation})`], galRows), false)}
    ${sec('🌙 Manazil al-Qamar — منازل القمر (28 stations lunaires)', `<p class="text-gray-500 text-xs mb-2">Système traditionnel arabe divisant le zodiaque en 28 stations que la Lune traverse en ≈ 27,3 jours. La station de ce soir est surlignée. Liens : nom arabe → Wikipédia arabe · constellation → Wikipédia · <a class="wikilink text-sky" href="https://en.wikipedia.org/wiki/Lunar_mansion" target="_blank" rel="noopener">article « Lunar mansion »</a> · <a class="wikilink text-sky" href="https://fr.wikipedia.org/w/index.php?search=mansions+lunaires+arabes" target="_blank" rel="noopener">recherche FR</a>.</p>` + tbl(['#','اسم عربي','Translittération','Signification','Constellation'], mzRows), false)}
    <p class="text-gray-500 text-[11px] mt-2">Magnitude apparente : plus bas (voire négatif) = plus brillant. Œil nu ≈ jusqu'à magnitude 6 sous ciel très sombre.</p>`;
}
function renderReady() {
  const v = $('view-ready');
  v.innerHTML = buildReadyHtml();
  // season filter
  const seasonNow = ['Hiver','Hiver','Printemps','Printemps','Printemps','Été','Été','Été','Automne','Automne','Automne','Hiver'][today.getMonth()];
  let active = seasonNow;
  const btns = v.querySelector('#seasonBtns'), list = v.querySelector('#seasonList');
  function paint() {
    btns.innerHTML = Object.keys(seasonConstellations).map(s => `<button data-s="${s}" class="px-2.5 py-1 rounded text-xs border ${s === active ? 'bg-sky text-night font-bold border-sky' : 'bg-panel2 text-gray-400 border-border hover:bg-border'}">${s}</button>`).join('');
    list.innerHTML = seasonConstellations[active].map(c => `<div class="bg-panel border border-border rounded-lg p-2.5 flex justify-between items-center"><a class="wikilink text-sky text-sm" href="${wikiConstelUrl(c)}" target="_blank" rel="noopener">${c}</a><span class="arabic text-gold text-sm">${constelArName(c)}</span></div>`).join('');
    btns.querySelectorAll('button').forEach(b => b.onclick = () => { active = b.dataset.s; paint(); });
  }
  paint();
  fillWeather();
}

// ====================================================================
//  MAIN TABS
// ====================================================================
function showView(name) {
  currentView = name;
  ['calendar', 'nav', 'ready'].forEach(n => $('view-' + n).classList.toggle('hidden', n !== name));
  document.querySelectorAll('#mainTabs button').forEach(b => {
    b.className = 'px-3 py-1 rounded text-[11px] border ' + (b.dataset.view === name ? 'bg-sky text-night font-bold border-sky' : 'bg-panel text-gray-300 border-border hover:bg-panel2');
  });
  if (name === 'ready' && readyDirty) { renderReady(); readyDirty = false; }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.querySelectorAll('#mainTabs button').forEach(b => b.onclick = () => showView(b.dataset.view));

// ====================================================================
//  INIT
// ====================================================================
setLocationButtons();
renderCalendar();
renderNav();
showView('calendar');
</script>
</body>
</html>
